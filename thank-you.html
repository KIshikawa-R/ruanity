<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ完了｜RUANITY株式会社</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.thank-you{min-height:calc(100vh - 188px);display:flex;align-items:center;justify-content:center;padding:90px 24px;background:var(--cream);text-align:center}
.thank-you-inner{max-width:650px}
.thank-you .label{margin-bottom:28px}
.thank-you h1{font:400 clamp(21px,3vw,30px)/1.7 'Noto Serif JP',serif;color:var(--deep);margin:0 0 24px}
.thank-you p.message{font-size:13px;line-height:2.1;margin:0 0 38px}
.thank-you a.back{display:inline-block;padding:13px 28px;border:1px solid var(--deep);color:var(--deep);font-size:12px;letter-spacing:.06em}
.thank-you a.back:hover{background:var(--deep);color:#fff}
@media(max-width:780px){.thank-you h1{font-size:clamp(20px,5vw,25px);line-height:1.75}.thank-you h1 .mobile-break{display:block}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html#top"><img src="assets/ruanity-logo.png" alt="RUANITY株式会社"></a>
<button class="menu" aria-label="メニュー" aria-expanded="false">MENU</button>
<nav><a href="company.html">ABOUT / COMPANY</a><a href="business.html">OUR BUSINESS</a><a href="index.html#contact">CONTACT</a></nav>
</header>
<main class="thank-you">
<div class="thank-you-inner">
<p class="label">CONTACT</p>
<h1>お問い合わせ<span class="mobile-break"></span>ありがとうございます。</h1>
<p class="message">お問い合わせを受け付けました。<br>内容を確認のうえ、担当者よりご連絡いたします。</p>
<a class="back" href="index.html">トップページに戻る</a>
</div>
</main>
<footer><div class="footbrand"><a href="index.html#top"><img src="assets/ruanity-logo.png" alt="RUANITY株式会社"></a></div><p>© 2026 RUANITY Inc.</p></footer>
<script>
const btn=document.querySelector('.menu');
btn.addEventListener('click',()=>{const open=document.body.classList.toggle('open');btn.setAttribute('aria-expanded',String(open));});
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>{document.body.classList.remove('open');btn.setAttribute('aria-expanded','false');}));
</script>
</body>
</html>
